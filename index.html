<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Уроки</title>
  <meta name="description" content="Календарь уроков, ученики и оплаты. Данные хранятся только на этом устройстве.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Уроки">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs" aria-label="Разделы">
    <button data-act="tab" data-tab="cal"><span class="ti">▦</span>Календарь</button>
    <button data-act="tab" data-tab="students"><span class="ti">☺</span>Ученики</button>
    <button data-act="voice" class="fab" aria-label="Голосовая команда">🎤</button>
    <button data-act="tab" data-tab="money"><span class="ti">₽</span>Деньги</button>
    <button data-act="tab" data-tab="more"><span class="ti">⋯</span>Ещё</button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <script>
    // Аварийный выход: показать ошибку и дать перезагрузить приложение начисто.
    (function () {
      function hardReload() {
        var jobs = [];
        if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n.indexOf('ocr') < 0; }).map(function (n) { return caches.delete(n); })); }));
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
        Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
      }
      window.__hardReload = hardReload;
      function show(msg) {
        if (document.getElementById('crash')) return;
        var d = document.createElement('div');
        d.id = 'crash';
        d.innerHTML = '<b>Что-то пошло не так</b><span></span><button type="button">Обновить приложение</button>';
        d.querySelector('span').textContent = msg;
        d.querySelector('button').onclick = hardReload;
        document.body.appendChild(d);
      }
      window.addEventListener('error', function (e) { show(e.message || 'Ошибка загрузки'); });
      window.addEventListener('unhandledrejection', function (e) { show(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () { if (!document.getElementById('view').children.length) show('Приложение не загрузилось'); }, 5000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
