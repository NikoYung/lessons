<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Уроки</title>
  <meta name="description" content="Календарь уроков, ученики и оплаты. Данные хранятся только на этом устройстве.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Уроки">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view"></main>
  <nav id="tabs" aria-label="Разделы">
    <button data-act="tab" data-tab="cal"><span class="ti">▦</span>Календарь</button>
    <button data-act="tab" data-tab="students"><span class="ti">☺</span>Ученики</button>
    <button data-act="voice" class="fab" aria-label="Голосовая команда">🎤</button>
    <button data-act="tab" data-tab="money"><span class="ti">₽</span>Деньги</button>
    <button data-act="tab" data-tab="more"><span class="ti">⋯</span>Ещё</button>
  </nav>
  <div id="sheet-root"></div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
